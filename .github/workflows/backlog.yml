# backlog/1 — what this repository intends to do.
#
# The fragment is a generated artifact: it is emitted from .backlog/items.json,
# which is where items are actually filed, and never hand-edited.
#
# The served copy is the PUBLIC PROJECTION and is written by the emitter, not
# copied by a step here — a copy step can be forgotten, and forgetting it would
# publish private items at a URL. Nothing reaches it until a named human runs
# promote, which is the whole consent rule expressed as a file path.
name: Backlog

on:
  push:
    paths-ignore:
      - 'backlog.fragment.json'
  pull_request:
  schedule:
    # Daily. Items decay, so a fragment that is a month old under-reports how
    # much of the plan has quietly stopped claiming to be current.
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backlog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Emit
        run: node vendor-backlog.mjs emit

      # Structural checks plus the two rules that matter: expiry is the derived
      # value, and nothing is published without a named human's promotion.
      - name: Check
        run: node vendor-backlog.mjs check backlog.fragment.json

      - name: Commit if it changed
        # Gated off pull_request: that checkout is a detached merge ref and the
        # push can only be rejected there. On a push, three emitters run on the
        # same commit and each pushes; only the first wins unless the losers
        # regenerate on the new tip and try again — the estate's canonical step,
        # copied from flashy-labs. Measured here 2026-10-10: exactly one of the
        # three emitter runs went green per push and the other two failed at
        # this step.
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "backlog"
          git config user.email "backlog@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
              echo "no change"
              exit 0
            fi
            git add -A
            git commit -m "backlog/1: refresh the fragment [skip ci]"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — $BRANCH moved; regenerating on the new tip"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            node vendor-backlog.mjs emit
          done
          echo "$BRANCH outran five attempts; the next push's run will refresh this"
          exit 1
      - name: Notify the estate graph
        if: steps.commit.outputs.pushed == 'true'
        env:
          TOKEN: ${{ secrets.ESTATE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Fan-out is not configured::The record changed and the estate graph was not told. The daily merge still finds it, so this is a delay of up to 24 hours rather than a loss. Set ESTATE_DISPATCH_TOKEN (an org secret with contents:write on FlashyLabs/flashyos) to close it."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/FlashyLabs/flashyos/dispatches -d '{"event_type":"estate-fragment-updated"}')
          if [ "$code" != "204" ]; then
            echo "::error title=Fan-out failed::flashyos returned $code to the dispatch. The daily merge is the fallback."
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "::notice::Estate graph notified."
      